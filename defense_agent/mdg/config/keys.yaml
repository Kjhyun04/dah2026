# keys.yaml — 키 3분리 계약 (E9/X1/E11/X9 · PS-3/PS-5). 절대 혼용 금지.
# ★ 이 파일은 키 원문을 담지 않는다 — provider(런타임 주입원)만 선언. verify_keys가 리터럴 비밀 0 강제.
# 각 비밀은 소유 서브시스템 프로세스 메모리/전용 keyring/tmpfs 마운트에만 (State/JSONL 미경유, PS-3).
keys:
  ingest_key:
    purpose: "Collector->MDG ingest HMAC/mTLS (per-collector, kid versioned)"   # ingest_verify / PS-2
    provider: "env:MDG_INGEST_KEYRING_PATH"        # tmpfs 0400 mount, current+previous kid
    owner: "collector + sense keyring"
    consumers: ["mdg.collector.ingest"]
  audit_key:
    purpose: "DecisionTrace hash-chain HMAC (WORM 대체)"                          # emit_trace
    provider: "env:MDG_AUDIT_KEYRING_PATH"
    owner: "ledger / verifier"
    consumers: ["mdg.ledger.intent_ledger"]
  sign_key:
    purpose: "MAVLink /sign.key (flight command signing)"                        # send_signed_mode
    provider: "gcs_c2 signer-shim only (mdg_core 미마운트, C-2 종속)"
    owner: "gcs_c2 signer-shim"
    consumers: []                                   # core/operator-gate: 확산 금지
  operator_cert:
    purpose: "operator mTLS client cert + (decision_id,command_digest,nonce,expiry) HMAC"  # PS-9
    provider: "env:MDG_OPERATOR_CA_PATH"
    owner: "operator-gate"
    consumers: ["operator-gate"]
  llm_key:
    purpose: "ANTHROPIC_API_KEY (litellm 생성자 env 주입, 프롬프트 렌더러 미접근)"          # PS-3
    provider: "env:ANTHROPIC_API_KEY"
    owner: "litellm client process"
    consumers: []                                   # State/JSONL 미경유

# 회전 (PS-5): kid 버전화(current+previous), grace 후 old drain. 이미지에 굽지 않음(tmpfs 0400).
rotation: {hmac: "kid-versioned current+previous", operator_token: "file + reload signal", grace_s: 300}

# 카나리 (PS-3): 실행 후 JSONL/checkpoint 스캔 시 0 이어야 함.
canary_env: ["MDG_CANARY_LLM", "MDG_CANARY_OP", "MDG_CANARY_HMAC"]
