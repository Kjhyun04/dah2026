# channel_quality.yaml — Confidence per-channel priors (FEASIBILITY §3, FIXED_VALUE)
# per-Evidence 기본신뢰 소스 없음 → 채널별 상수. compute_confidence의 avg_quality 입력.
channel_quality:
  plaintext_mavlink_tap: 0.95     # 14560/14556 평문 MAVLink 탭 (tap_mavlink_cmd, tap_telemetry_14560)
  prometheus_9090: 0.90           # scrape_pfcp_metrics
  nas_log: 0.85                   # read_nas_cipher / EPC 로그
  mongo_conn_log: 0.60            # tail_mongo_conn (연결 단위, per-query 불가)
  active_probe_estimate: 0.70     # probe_rtt_loss

# tool_id -> channel prior (build_evidence가 Evidence에 부착)
tool_channel:
  tap_mavlink_cmd: plaintext_mavlink_tap
  tap_telemetry_14560: plaintext_mavlink_tap
  tail_signing_drops: nas_log
  scrape_pfcp_metrics: prometheus_9090
  tail_pfcp_smflog: nas_log
  tail_mme_log: nas_log
  read_nas_cipher: nas_log
  tail_upf_antispoof: nas_log
  probe_rtt_loss: active_probe_estimate
  tail_mongo_conn: mongo_conn_log

# 감쇠/충돌 (compute_confidence): conf = avg_q * corr * decay * (1 - conflict)
decay: {half_life_s: 60, policy_half_life_s: 300}
