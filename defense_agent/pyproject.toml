[project]
name = "defense_agent"
version = "0.1.0"
description = "DAH 2026 MDG(Mission-centric Defense Gateway) 방어 AI 에이전트 — 결정론 라우팅 + leak-0 실행의 자율 방어(evidence→correlate→select_policy→legality→rank_recovery→gate→act). 인가된 격리 샌드박스 전용."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "litellm>=1.50",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "grpcio>=1.60",
    "httpx>=0.27",
]

# 회귀 테스트 실행(./dah.sh test)용. `pip install -e ".[dev]"` 로 포함.
[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdg*"]
