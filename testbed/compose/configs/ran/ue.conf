# uav_ue — srsue (ZMQ). USIM은 가입자(IMSI/K/OPc)와 일치. dl_earfcn=rr.conf 셀(3350).
[rf]
device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://ran_enb:2000,id=ue,base_srate=23.04e6

[rat.eutra]
dl_earfcn    = 3350
nof_carriers = 1

[usim]
mode = soft
algo = milenage
opc  = 63bfa50ee6523365ff14c1f45f88737d
k    = 00112233445566778899aabbccddeeff
imsi = 001010000000001
imei = 353490069873319

[rrc]
[nas]
apn = internet

[gw]

[gui]
enable = false

[log]
all_level     = warning
filename      = /tmp/ue.log
file_max_size = 51200
