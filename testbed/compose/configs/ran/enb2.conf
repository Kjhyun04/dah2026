# ran_enb2 — srsenb #2 (ZMQ) · attacker_ue 전용. MME=10.44.0.10, PLMN 001/01.
# enb.conf에서 분기: enb_id 0x19C, S1 bind .21, ZMQ 2100/2101, id=enb2.
[enb]
enb_id        = 0x19C
mcc           = 001
mnc           = 01
mme_addr      = 10.44.0.10
gtp_bind_addr = 10.44.0.21
s1c_bind_addr = 10.44.0.21
n_prb         = 50

[enb_files]
sib_config = /usr/local/share/srsran/sib.conf.example
rr_config  = /usr/local/share/srsran/rr.conf.example
rb_config  = /usr/local/share/srsran/rb.conf.example

[rf]
device_name = zmq
device_args = fail_on_disconnect=false,tx_port=tcp://*:2100,rx_port=tcp://attacker_ue:2101,id=enb2,base_srate=23.04e6

[log]
all_level     = warning
rrc_level     = info
filename      = /tmp/enb2.log
file_max_size = 51200

[pcap]
enable = false

[expert]
eea_pref_list = EEA2, EEA1, EEA0
eia_pref_list = EIA2, EIA1, EIA0
