# ran_enb — srsenb (ZMQ). MME=10.44.0.10, PLMN 001/01. sib/rr/rb는 stock 예제 참조.
[enb]
enb_id        = 0x19B
mcc           = 001
mnc           = 01
mme_addr      = 10.44.0.10
gtp_bind_addr = 10.44.0.20
s1c_bind_addr = 10.44.0.20
n_prb         = 50

[enb_files]
sib_config = /usr/local/share/srsran/sib.conf.example
rr_config  = /usr/local/share/srsran/rr.conf.example
rb_config  = /usr/local/share/srsran/rb.conf.example

[rf]
device_name = zmq
device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://uav_ue:2001,id=enb,base_srate=23.04e6

[log]
all_level     = warning
rrc_level     = info
filename      = /tmp/enb.log
file_max_size = 51200

[pcap]
enable = false

[expert]
# AS/PDCP 암호 우선순위 — EEA2(AES) 우선 (기본은 EEA0 우선이라 널암호 선택됨)
eea_pref_list = EEA2, EEA1, EEA0
eia_pref_list = EIA2, EIA1, EIA0
