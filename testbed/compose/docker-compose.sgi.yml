# P4 — SGi("인터넷") 망 + 테스트 호스트. epc(UPF)는 40 스크립트가 net_sgi에 연결(172.30.0.1).
name: dahv2

networks:
  net_sgi:
    name: net_sgi
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  sgi_test:
    image: dahv2/ran:latest
    container_name: sgi_test
    cap_add: [NET_ADMIN]
    networks:
      net_sgi:
        ipv4_address: 172.30.0.100
    command: ["sleep", "infinity"]
    restart: unless-stopped
