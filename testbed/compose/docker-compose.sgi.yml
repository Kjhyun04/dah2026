# P4 — SGi("인터넷") 망 + 테스트 호스트. epc(UPF)는 40 스크립트가 net_sgi에 연결(172.30.0.1).
name: dahv2

networks:
  net_sgi:
    # bringup(step 0)이 net_sgi 를 미리 docker network create 하므로 compose 는 참조만 한다.
    # external 누락 시 compose 가 관리를 시도→"not created by compose" 라벨오류로 sgi_test 미생성(18/19).
    external: true
    name: net_sgi

services:
  sgi_test:
    image: dahv2/ran:latest
    container_name: sgi_test
    cap_add: [NET_ADMIN]
    networks:
      net_sgi:
        ipv4_address: 172.30.0.100
    command: ["sleep", "infinity"]
    restart: unless-stopped
