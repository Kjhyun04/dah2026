# P4 — SGi("인터넷") 망 + 테스트 호스트. epc(UPF)는 40 스크립트가 net_sgi에 연결(172.30.0.1).
name: dahv2

networks:
  net_sgi:
    # bringup(step 0)이 net_sgi 를 미리 docker network create 하므로 compose 는 참조만 한다.
    # external 을 빠뜨리면 compose 가 네트워크를 직접 관리하려다 "not created by compose" 라벨 오류가 나고, 그 탓에 sgi_test 가 생성되지 않는다(19개 중 18개만 뜸).
    external: true
    name: net_sgi

services:
  sgi_test:
    image: dahv2/ran:latest
    container_name: sgi_test
    cap_add: [NET_ADMIN]
    networks:
      net_sgi:
        ipv4_address: 172.30.0.100
    command: ["sleep", "infinity"]
    restart: unless-stopped
