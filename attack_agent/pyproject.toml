[project]
name = "attack_agent"
version = "0.1.0"
description = "DAH 2026 공격 AI 에이전트 (적응적 자동 공격계획 + 독립 복호검증). 샌드박스 전용."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "litellm>=1.50",
    "pymavlink>=2.4.49",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
